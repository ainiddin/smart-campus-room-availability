<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Campus — Room Availability</title>
  <link rel="stylesheet" href="/src/style.css" />
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
<body>
  <main class="card">
    <header>
      <p class="eyebrow">Smart Campus</p>
      <h1>Room Availability Checker</h1>
      <p class="muted">Room <span id="room-name">B-201</span> — all data is fictional.</p>
    </header>

    <form id="form" novalidate>
      <label>Start date &amp; time
        <input type="datetime-local" id="start" />
      </label>
      <label>Duration (minutes, max 120)
        <input type="number" id="duration" min="1" max="120" step="1" inputmode="numeric" placeholder="e.g. 60" />
      </label>
      <label class="check-row">
        <input type="checkbox" id="blocked" /> Room blocked
      </label>
      <button type="submit" id="check">Check availability</button>
    </form>

    <div id="result" class="result" role="status" aria-live="polite" hidden>
      <div class="result-row">
        <span class="badge" data-role="badge">—</span>
        <span class="code" data-role="code"></span>
      </div>
      <span class="message" data-role="message"></span>
    </div>

    <section>
      <h2>Existing bookings</h2>
      <ul id="bookings"></ul>
      <p class="muted">Bookings count: <span id="count">0</span></p>
    </section>

    <hr />

    <section class="test-section">
      <h2>Automated tests</h2>
      <button type="button" id="run-tests">Run tests</button>
      <div id="test-results" hidden>
        <table>
          <thead>
            <tr><th>ID</th><th>Input</th><th>Expected</th><th>Observed</th><th>Status</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
